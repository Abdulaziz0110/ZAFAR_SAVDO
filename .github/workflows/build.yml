name: Build & unit tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # DIQQAT: bu APK CI'ning vaqtinchalik kaliti bilan imzolanadi,
      # agent telefoniga O'RNATMANG. Faqat build tekshiruvi.
      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK (CI-only, do not install on agent phones)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMSOFT_DOKON-debug-apk-CI-ONLY
          path: app/build/outputs/apk/debug/*.apk
