# IMSOFT DOKON - Savdo (app: one app, role by login) + Savdo Mijoz (mijoz)
# Repo root: upload IMSOFT_DOKON-project.zip and commit. This workflow:
#   1) unzips it SYNCHRONOUSLY (old files are removed, except .git, .github, signing and *.zip) and commits the sources,
#   2) builds two APKs - Savdo (admin package), Mijoz (debug, signed with SIGNING_* secrets if present) and uploads them as an artifact,
#   3) runs unit tests, lint, the PC script tests and the iPhone (web) agent tests; reports go to the "reports" artifact,
#   4) publishes the iPhone agent (web/agent) to Cloudflare Pages (free, works with a private repo),
#      and (v4.0) the new APKs + version.json to a hidden folder there - the apps update themselves.
#      Without the CLOUDFLARE_* secrets this job is skipped (green) - APKs are not affected.
#   5) (v4.0) "smoke": installs the three APKs on an Android emulator and opens each one - a crash on start is reported.
# Secrets (Settings > Secrets and variables > Actions), optional:
#   SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID
#   SHOP_CODE (v4.0, Admin > Boshqaruv > Qurilmalar > "Do'kon kodi"): Agent/Mijoz work without codes and update themselves
# The keystore is never committed: it is written to the runner temp folder only for the build.
name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_PROJECT: zafar-savdo-agent

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.sign.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync sources from ZIP
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          # Pick the ZIP that was committed LAST (file dates after checkout are all equal, so "ls -t" is not reliable)
          ZIP=""
          BEST=-1
          for z in *.zip; do
            [ -f "$z" ] || continue
            T=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            [ -z "$T" ] && T=0
            echo "found: $z (commit time $T)"
            if [ "$T" -gt "$BEST" ]; then BEST=$T; ZIP="$z"; fi
          done
          if [ -z "$ZIP" ]; then
            echo "No ZIP in repo root - building current sources"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $ZIP"
          TMP=$(mktemp -d)
          unzip -q -o "$ZIP" -d "$TMP"
          SRC="$TMP"
          if [ ! -f "$SRC/settings.gradle.kts" ]; then
            INNER=$(find "$TMP" -maxdepth 2 -name settings.gradle.kts | head -n 1 || true)
            if [ -z "$INNER" ]; then echo "settings.gradle.kts not found in ZIP"; exit 1; fi
            SRC=$(dirname "$INNER")
          fi
          # Remove old files (keep .git, .github, signing, zip files)
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name 'signing' ! -name '*.zip' \
            -exec rm -rf {} +
          # Copy new sources (never overwrite .git / .github from the ZIP)
          (cd "$SRC" && tar --exclude='./.git' --exclude='./.github' -cf - .) | tar -xf -
          rm -rf "$TMP"
          # Old ZIPs are removed so the next build can never pick an old one
          for z in *.zip; do
            [ -f "$z" ] && [ "$z" != "$ZIP" ] && git rm -q -f "$z" || true
          done
          chmod +x gradlew
          echo "App version: $(grep -m1 versionName app/build.gradle.kts)"
          echo "Mijoz version: $(grep -m1 versionName mijoz/build.gradle.kts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Sync sources from $ZIP"
            git push -q || echo "push skipped"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Signing (from secrets, optional)
        id: sign
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f keystore.properties
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ] && [ -n "${SIGNING_STORE_PASSWORD:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$KS"
            KP="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
            {
              echo "storeFile=$KS"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$KP"
            } > keystore.properties
            echo "Certificate SHA-256:"
            keytool -list -v -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | grep -i "SHA256" || true
            echo "tag=OWN-KEY" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: CI key is used (APK will NOT install over the existing app)"
            echo "tag=CI-ONLY" >> "$GITHUB_OUTPUT"
          fi

      - name: Shop code and update address (v4.0)
        id: shop
        shell: bash
        env:
          SHOP_CODE: ${{ secrets.SHOP_CODE }}
        run: |
          set -euo pipefail
          if [ -z "${SHOP_CODE:-}" ]; then
            echo "::notice::SHOP_CODE secret is empty - apps will ask for a link code and will not update themselves"
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIR=$(python3 - <<'PY'
          import base64, hashlib, os, re
          code = os.environ["SHOP_CODE"].strip()
          m = re.search(r"IMSHOP1:([A-Za-z0-9_-]+)", code)
          if not m:
              print("")
          else:
              b = m.group(1)
              parts = base64.urlsafe_b64decode(b + "=" * (-len(b) % 4)).decode("utf-8").split("\n")
              print(hashlib.sha256((parts[2].strip() + "|upd").encode("utf-8")).hexdigest()[:24] if len(parts) >= 3 else "")
          PY
          )
          if [ -z "$DIR" ]; then echo "::warning::SHOP_CODE is not valid (copy it again from Admin > Qurilmalar)"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "UPDATE_URL=https://${CF_PROJECT}.pages.dev/u/$DIR/" >> "$GITHUB_ENV"

      - name: Build APKs
        shell: bash
        env:
          SHOP_CODE: ${{ secrets.SHOP_CODE }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleAdminDebug :mijoz:assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          AV=$(grep -m1 versionName app/build.gradle.kts | sed 's/[^0-9.]//g')
          MV=$(grep -m1 versionName mijoz/build.gradle.kts | sed 's/[^0-9.]//g')
          cp app/build/outputs/apk/admin/debug/*.apk "out/SavdoAdmin-$AV-${{ steps.sign.outputs.tag }}.apk"
          cp mijoz/build/outputs/apk/debug/*.apk "out/SavdoMijoz-$MV-${{ steps.sign.outputs.tag }}.apk"
          ls -la out

      - name: Prepare self-update files (v4.0)
        if: steps.sign.outputs.tag == 'OWN-KEY' && steps.shop.outputs.dir != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upd
          AVC=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]//g')
          AV=$(grep -m1 versionName app/build.gradle.kts | sed 's/[^0-9.]//g')
          MVC=$(grep -m1 'versionCode = ' mijoz/build.gradle.kts | sed 's/[^0-9]//g')
          MV=$(grep -m1 versionName mijoz/build.gradle.kts | sed 's/[^0-9.]//g')
          cp out/SavdoAdmin-*.apk upd/admin.apk
          cp out/SavdoMijoz-*.apk upd/mijoz.apk
          for f in upd/*.apk; do
            if [ "$(stat -c %s "$f")" -gt 26000000 ]; then echo "::warning::$f is larger than 25 MB (Cloudflare limit) - not published"; rm -f "$f"; fi
          done
          # v5.3: the PC scripts update themselves too (pc.zip + pc.json with sha256)
          (cd pc && zip -q -r ../upd/pc.zip . -x '*.ini' -x '*.json' -x '*.jsonl' -x '__pycache__/*' -x 'test_*' -x 'backup/*')
          python3 - <<'PCJSON'
          import hashlib, json
          raw = open("upd/pc.zip", "rb").read()
          v = int(open("pc/pc_version.txt").read().strip())
          json.dump({"v": v, "zip": "pc.zip", "sha": hashlib.sha256(raw).hexdigest()}, open("upd/pc.json", "w"))
          print("pc version", v, len(raw), "bytes")
          PCJSON
          python3 - "$AVC" "$AV" "$MVC" "$MV" <<'PY'
          import json, os, sys
          avc, av, mvc, mv = sys.argv[1:5]
          out = {}
          for key, vc, v in (("admin", avc, av), ("mijoz", mvc, mv)):
              f = "upd/%s.apk" % key
              if os.path.exists(f):
                  out[key] = {"vc": int(vc), "v": v, "apk": "%s.apk" % key, "size": os.path.getsize(f)}
          json.dump(out, open("upd/version.json", "w"))
          print(out)
          PY

      - name: Upload self-update files
        if: steps.sign.outputs.tag == 'OWN-KEY' && steps.shop.outputs.dir != ''
        uses: actions/upload-artifact@v6
        with:
          name: update
          path: upd
          retention-days: 7

      - name: Upload iPhone agent (web)
        uses: actions/upload-artifact@v6
        with:
          name: web-agent
          path: web/agent
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ steps.sign.outputs.tag }}
          path: out/*.apk
          retention-days: 30

      - name: Unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :app:testAdminDebugUnitTest :mijoz:testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :app:lintAdminDebug :mijoz:lintDebug

      - name: PC script tests
        id: pctests
        continue-on-error: true
        shell: bash
        run: |
          python3 pc/test_forwarder.py
          python3 pc/test_onec_export.py
          python3 pc/test_ornatish.py
          python3 pc/test_onec_data.py
          python3 pc/test_onec_scale.py
          python3 pc/test_onec_write2.py
          python3 pc/test_relay.py
          python3 pc/test_selfupdate.py
          python3 pc/test_kassa_core.py
          python3 pc/test_kassa.py
          python3 pc/test_onec_bridge.py
          python3 pc/test_kassa_panel.py
          node pc/test_kassa_logic.js
          if python3 -c "import PIL" 2>/dev/null; then python3 pc/test_label_printer.py; else pip install -q pillow && python3 pc/test_label_printer.py; fi

      - name: iPhone agent (web) tests
        id: webtests
        continue-on-error: true
        shell: bash
        run: node web/agent/test/core.test.js

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            mijoz/build/reports/
            app/build/test-results/
            mijoz/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Result
        if: always()
        shell: bash
        run: |
          echo "Unit tests: ${{ steps.tests.outcome }}"
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "PC tests: ${{ steps.pctests.outcome }}"
          echo "Web agent tests: ${{ steps.webtests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.pctests.outcome }}" != "success" ] || [ "${{ steps.webtests.outcome }}" != "success" ]; then
            echo "::warning::Tests failed - see the reports artifact"
          fi

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CF_PROJECT: zafar-savdo-agent
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: chk
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iPhone agent not published: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"
          fi

      - name: Download iPhone agent (web)
        if: steps.chk.outputs.ok == 'true'
        uses: actions/download-artifact@v7
        with:
          name: web-agent
          path: site

      - name: Self-update folder (v4.0)
        if: steps.chk.outputs.ok == 'true'
        id: upd
        shell: bash
        env:
          SHOP_CODE: ${{ secrets.SHOP_CODE }}
        run: |
          DIR=$(python3 - <<'PY'
          import base64, hashlib, os, re
          m = re.search(r"IMSHOP1:([A-Za-z0-9_-]+)", os.environ.get("SHOP_CODE", ""))
          if m:
              b = m.group(1)
              p = base64.urlsafe_b64decode(b + "=" * (-len(b) % 4)).decode("utf-8").split("\n")
              print(hashlib.sha256((p[2].strip() + "|upd").encode("utf-8")).hexdigest()[:24] if len(p) >= 3 else "")
          PY
          )
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Download self-update files
        if: steps.chk.outputs.ok == 'true' && steps.upd.outputs.dir != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: update
          path: site/u/${{ steps.upd.outputs.dir }}

      - name: Create Cloudflare Pages project (first run only)
        if: steps.chk.outputs.ok == 'true'
        continue-on-error: true
        shell: bash
        run: npx --yes wrangler@3.90.0 pages project create "$CF_PROJECT" --production-branch=main

      - name: Publish iPhone agent to Cloudflare Pages
        if: steps.chk.outputs.ok == 'true'
        shell: bash
        run: |
          rm -rf site/test
          npx --yes wrangler@3.90.0 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
          echo "::notice::iPhone agent: https://$CF_PROJECT.pages.dev (if the name was taken, see the Cloudflare dashboard)"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: apk-${{ needs.build.outputs.tag }}
          path: apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke script
        shell: bash
        run: |
          cat > smoke.sh <<'EOS'
          fail=0
          for a in apk/*.apk; do adb install -r "$a" || fail=1; done
          for p in com.ibrohimjon.imsoft_dokon_som_val.admin com.ibrohimjon.imsoft_mijoz; do
            adb logcat -b crash -c || true
            adb shell monkey -p "$p" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            sleep 15
            if adb logcat -b crash -d | grep -q "$p"; then
              echo "::error::$p crashed on start"
              adb logcat -b crash -d | tail -80 | tee "crash_$p.txt"
              fail=1
            else
              echo "$p opened OK"
            fi
            adb shell am force-stop "$p" || true
          done
          exit $fail
          EOS

      - name: Open apps on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash smoke.sh

      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-crash
          path: crash_*.txt
          if-no-files-found: ignore
          retention-days: 7
