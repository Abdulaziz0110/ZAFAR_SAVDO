# IMSOFT DOKON - Savdo Agent (app) + Savdo Mijoz (mijoz)
# Repo root: upload IMSOFT_DOKON-project.zip and commit. This workflow:
#   1) unzips it SYNCHRONOUSLY (old files are removed, except .git, .github, signing and *.zip) and commits the sources,
#   2) builds both APKs (debug, signed with SIGNING_* secrets if present) and uploads them as an artifact,
#   3) runs unit tests, lint and the PC script tests; reports go to the "reports" artifact.
# Secrets (Settings > Secrets and variables > Actions), optional:
#   SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# The keystore is never committed: it is written to the runner temp folder only for the build.
name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync sources from ZIP
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No ZIP in repo root - building current sources"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $ZIP"
          TMP=$(mktemp -d)
          unzip -q -o "$ZIP" -d "$TMP"
          SRC="$TMP"
          if [ ! -f "$SRC/settings.gradle.kts" ]; then
            INNER=$(find "$TMP" -maxdepth 2 -name settings.gradle.kts | head -n 1 || true)
            if [ -z "$INNER" ]; then echo "settings.gradle.kts not found in ZIP"; exit 1; fi
            SRC=$(dirname "$INNER")
          fi
          # Remove old files (keep .git, .github, signing, zip files)
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name 'signing' ! -name '*.zip' \
            -exec rm -rf {} +
          # Copy new sources (never overwrite .git / .github from the ZIP)
          (cd "$SRC" && tar --exclude='./.git' --exclude='./.github' -cf - .) | tar -xf -
          rm -rf "$TMP"
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Sync sources from $ZIP"
            git push -q || echo "push skipped"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Signing (from secrets, optional)
        id: sign
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f keystore.properties
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ] && [ -n "${SIGNING_STORE_PASSWORD:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$KS"
            KP="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
            {
              echo "storeFile=$KS"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$KP"
            } > keystore.properties
            echo "Certificate SHA-256:"
            keytool -list -v -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | grep -i "SHA256" || true
            echo "tag=OWN-KEY" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: CI key is used (APK will NOT install over the existing app)"
            echo "tag=CI-ONLY" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :mijoz:assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/SavdoAgent-${{ steps.sign.outputs.tag }}.apk"
          cp mijoz/build/outputs/apk/debug/*.apk "out/SavdoMijoz-${{ steps.sign.outputs.tag }}.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.sign.outputs.tag }}
          path: out/*.apk
          retention-days: 30

      - name: Unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :app:testDebugUnitTest :mijoz:testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :app:lintDebug :mijoz:lintDebug

      - name: PC script tests
        id: pctests
        continue-on-error: true
        shell: bash
        run: |
          python3 pc/test_forwarder.py
          python3 pc/test_onec_export.py
          python3 pc/test_ornatish.py
          if python3 -c "import PIL" 2>/dev/null; then python3 pc/test_label_printer.py; else pip install -q pillow && python3 pc/test_label_printer.py; fi

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            mijoz/build/reports/
            app/build/test-results/
            mijoz/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Result
        if: always()
        shell: bash
        run: |
          echo "Unit tests: ${{ steps.tests.outcome }}"
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "PC tests: ${{ steps.pctests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.pctests.outcome }}" != "success" ]; then
            echo "::warning::Tests failed - see the reports artifact"
          fi
