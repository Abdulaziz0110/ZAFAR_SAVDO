name: ZIP'dan yangilash

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP'ni ochish va almashtirish
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then echo "ZIP topilmadi"; exit 0; fi
          rm -rf /tmp/u && mkdir -p /tmp/u && unzip -q "$ZIP" -d /tmp/u
          SRC=/tmp/u
          if [ "$(ls -A /tmp/u | wc -l)" = 1 ] && [ -d "/tmp/u/$(ls -A /tmp/u)" ]; then SRC="/tmp/u/$(ls -A /tmp/u)"; fi
          if [ ! -f "$SRC/settings.gradle.kts" ]; then echo "::error::Bu IMSOFT loyihasi emas"; exit 1; fi
          cp .github/workflows/unzip.yml /tmp/unzip.keep
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. ./
          mkdir -p .github/workflows && cp /tmp/unzip.keep .github/workflows/unzip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; else git commit -qm "ZIP'dan yangilandi"; git push; fi

      - name: Build'ni ishga tushirish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
