<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savdo Mijoz">
<meta name="theme-color" content="#0f6b54">
<title>Savdo Mijoz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --brand: #0f6b54; --on-brand: #fff; --brand-soft: #d9f0e8; --on-soft: #0a3d30; --bg: #f3f6f4; --card: #fff; --ink: #14201b;
  --ink2: #5b6a64; --line: #dde5e1; --warn: #c62828; --warn-soft: #fdeceb; --ok: #2e7d32; --amber: #8a5a00; --amber-soft: #fff1d6;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --brand: #45d1a6; --on-brand: #00281d; --brand-soft: #173a30; --on-soft: #bff2e0; --bg: #0e1412; --card: #171f1c; --ink: #e8efec;
    --ink2: #9fb0a9; --line: #26322d; --warn: #ff8a80; --warn-soft: #3a1d1b; --ok: #8fd694; --amber: #ffcf7a; --amber-soft: #3a2c10;
    --shadow: none; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
#app { max-width: 720px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
header.bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 56px; }
header.bar h1 { font-size: 21px; font-weight: 700; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { border: 0; background: none; color: var(--ink); width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; }
.ib:active { background: var(--line); }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
main { flex: 1; padding: 0 16px 96px; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.hero { background: linear-gradient(135deg, var(--brand), #0a5341); color: #fff; border-radius: 22px; padding: 18px; margin: 8px 0 12px; }
@media (prefers-color-scheme: dark) { .hero { background: linear-gradient(135deg, #12584a, #0b3b31); } }
.hero .lb { opacity: .85; font-size: 14px; }
.hero .amt { font-size: 32px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0; }
.hero .sub { opacity: .85; font-size: 13px; }
.hero.ok .amt { color: #c8ffe6; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.tile { background: var(--card); color: var(--ink); border: 0; border-radius: 18px; min-height: 96px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 8px; box-shadow: var(--shadow); text-align: center; }
.tile .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--brand-soft); color: var(--on-soft); display: flex; align-items: center; justify-content: center; }
.tile .ic svg.i { width: 26px; height: 26px; }
.tile:active { transform: scale(.98); }
.muted { color: var(--ink2); font-size: 13px; }
.err { color: var(--warn); font-size: 14px; margin: 6px 0; }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border: 0; border-radius: 16px;
  background: var(--brand); color: var(--on-brand); font-size: 17px; font-weight: 700; margin: 10px 0; padding: 0 16px; }
.btn.soft { background: var(--brand-soft); color: var(--on-soft); }
.btn.line { background: none; color: var(--brand); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; }
.btn:active { filter: brightness(.94); }
input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; margin: 6px 0; }
textarea { min-height: 80px; }
input:focus, textarea:focus { outline: none; border-color: var(--brand); }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin-top: 10px; }
.seg { display: flex; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; margin: 8px 0; }
.seg button { flex: 1; border: 0; background: none; color: var(--ink); min-height: 40px; font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--brand); color: var(--on-brand); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.chip.on { background: var(--brand-soft); color: var(--on-soft); border-color: transparent; }
.sticky { position: sticky; top: 0; background: var(--bg); z-index: 2; padding-top: 4px; }
.item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item .n { flex: 1; min-width: 0; }
.item .t { font-size: 16px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.price { color: var(--brand); font-weight: 800; font-size: 16px; white-space: nowrap; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; }
.step button.plus { background: var(--brand); color: var(--on-brand); border: 0; }
.step .q { min-width: 40px; text-align: center; font-weight: 800; }
.day { font-size: 14px; color: var(--brand); font-weight: 800; margin: 16px 0 4px; }
.doc { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.doc .k { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--brand-soft); color: var(--on-soft); }
.doc .k.pay { background: #dff0ff; color: #0b4a85; }
.doc .k.ret { background: var(--amber-soft); color: var(--amber); }
@media (prefers-color-scheme: dark) { .doc .k.pay { background: #13304a; color: #a8d4ff; } }
.doc .m { flex: 1; min-width: 0; }
.doc .a { font-weight: 800; white-space: nowrap; }
.doc .a.plus { color: var(--ok); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
.tabs .in { display: flex; width: 100%; max-width: 720px; }
.tabs button { flex: 1; border: 0; background: none; color: var(--ink2); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px;
  font-size: 12px; font-weight: 700; position: relative; }
.tabs button.on { color: var(--brand); }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--warn); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; line-height: 18px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 88vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
.sheet .scroll { overflow: auto; flex: 1; }
.sheet h2 { margin: 4px 0 8px; font-size: 19px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); background: #27302c; color: #fff;
  padding: 12px 18px; border-radius: 12px; z-index: 30; max-width: 90%; font-size: 15px; }
.sp { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: currentColor; border-radius: 50%; animation: s 1s linear infinite; vertical-align: middle; }
@keyframes s { to { transform: rotate(360deg); } }
.tot { display: flex; justify-content: space-between; padding: 6px 0; }
.tot.b { font-weight: 800; font-size: 18px; }
.st { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 700; background: var(--line); }
.st.taken { background: var(--brand-soft); color: var(--on-soft); }
.st.rejected { background: var(--warn-soft); color: var(--warn); }
.cartbar { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 9; padding: 0 12px; }
.cartbar button { width: 100%; max-width: 696px; margin: 0; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.empty { text-align: center; color: var(--ink2); padding: 40px 10px; }
</style>
</head>
<body>
<div id="app"><main><p class="muted" style="margin-top:40px;text-align:center">Yuklanmoqda…</p></main></div>
<noscript>Ilova ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
<script src="../core.js"></script>
<script src="mcore.js"></script>
<script src="app.js"></script>
</body>
</html>
